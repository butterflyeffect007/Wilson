name: Keep TTS Alive

# Pings the Wilson TTS service's /health endpoint on a schedule so Render's
# free tier never spins it down. Render sleeps instances after 15 minutes of
# inactivity, so a ping every 14 minutes keeps it warm.
#
# Schedule: every 14 minutes, 8am-5pm Central (13:00-22:00 UTC), every day.
# Uses ~1,500 of the 2,000 free GitHub Actions minutes per month.

on:
  schedule:
    - cron: '*/14 13-22 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TTS health endpoint
        env:
          TTS_URL: ${{ secrets.TTS_URL || 'https://wilson-tts.onrender.com' }}  # override via repo secret if your URL differs
        run: |
          set -euo pipefail
          echo "Pinging $TTS_URL/health ..."
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 "$TTS_URL/health"
          echo ""
          echo "OK"
