name: Preview PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to preview"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Separate from the live "pages" concurrency group in deploy-pages.yml.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch authentic Wilson Orb fluid asset
        run: |
          mkdir -p src/assets
          curl -fsSL -o src/assets/wilson-fluid.png \
            "https://raw.githubusercontent.com/jennifercox726-ux/wilsonaibro/main/src/assets/wilson-fluid.png"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Wilson/preview/pr-${{ env.PR_NUMBER }}/
          # Preview builds keep their own storage and never register a service worker (src/lib/previewIsolation.ts).
          VITE_PREVIEW_ID: pr-${{ env.PR_NUMBER }}
          # Preview-only: talk to the isolated wilson-proxy-preview worker, not production.
          VITE_WILSON_PROXY_URL: https://wilson-proxy-preview.butterflyeffect007.workers.dev

      # Publish into a subfolder of gh-pages. keep_files must stay true.
      # Do not set force_orphan — that would wipe the live site.
      - name: Publish preview (does not replace the live site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ env.PR_NUMBER }}
          keep_files: true

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const n = process.env.PR_NUMBER;
            const url = `https://butterflyeffect007.github.io/Wilson/preview/pr-${n}/`;
            const body = `Preview: ${url}\n\nThis is a preview only. The live site is unchanged. It talks to the preview worker at https://wilson-proxy-preview.butterflyeffect007.workers.dev (not production).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(n),
            });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes("/preview/pr-"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(n),
                body,
              });
            }

  # When a proposal is approved (merged) or declined (closed), remove its preview from gh-pages.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview/pr-N from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.pull_request.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf site
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
            cd site
            if [ ! -d "preview/pr-${N}" ]; then echo "No preview/pr-${N} on gh-pages; nothing to clean."; exit 0; fi
            git rm -rq "preview/pr-${N}"
            git commit -qm "Remove preview for PR #${N}"
            if git push origin gh-pages; then echo "Removed preview/pr-${N}"; exit 0; fi
            cd ..
            sleep $((attempt * 10))
          done
          echo "Could not remove preview/pr-${N} after retries"; exit 1
