name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch authentic Wilson Orb fluid asset
        run: |
          mkdir -p src/assets
          curl -fsSL -o src/assets/wilson-fluid.png \
            "https://raw.githubusercontent.com/jennifercox726-ux/wilsonaibro/main/src/assets/wilson-fluid.png"
          ls -la src/assets/wilson-fluid.png

      - name: Install
        run: npm install --onnxruntime-node-install-cuda=skip

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Wilson/

      - name: Keep previews of changes still waiting for approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ghp; then echo "No gh-pages yet"; exit 0; fi
          [ -d /tmp/ghp/preview ] || { echo "No previews to keep"; exit 0; }
          for n in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number -q '.[].number'); do
            if [ -d "/tmp/ghp/preview/pr-$n" ]; then mkdir -p dist/preview; cp -r "/tmp/ghp/preview/pr-$n" "dist/preview/pr-$n"; echo "Kept preview/pr-$n"; fi
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
