name: Deploy Operator live browser (optional)

# Manual only. Run it from the Actions tab (works from a phone browser) after
# adding the three repository secrets listed in workers/operator-browser/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: workers/operator-browser
        run: npm install

      - name: Deploy to Cloudflare (Workers Free plan)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/operator-browser
          secrets: |
            OPERATOR_TOKEN
        env:
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
